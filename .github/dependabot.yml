# Weekly pull requests to keep dependencies and CI actions up to date,
# so security fixes in Next.js, Express, Socket.io and friends arrive on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps arrive as one PR instead of many.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
