# Render Blueprint, free plan: New > Blueprint, pick this repo, and set the
# Blueprint path to render.free.yaml.
# Free instances have no disk, so the database lives in the container:
# accounts and scores reset whenever the service restarts or redeploys, and
# the service sleeps after 15 minutes without visitors (the next visit takes
# about a minute to wake it). Use render.yaml (Starter plan + disk) to keep data.
services:
  - type: web
    name: matik
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_AFTER_SECONDS
        value: "10"
      - key: DAILY_UTC_OFFSET_MIN
        value: "330"
